<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TMG Live Contract — Review Copy — MCF — 2026 (Rev. 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quattrocento:wght@400;700&family=Fanwood+Text:ital@0;1&family=Allison&family=Caveat&family=Dancing+Script&family=Great+Vibes&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
/* ---- Rev. 2 additions ---- */
.rev2-note {
  margin: 0 0 28px;
  padding: 16px 20px;
  border: 1px solid var(--gold);
  border-radius: 3px;
  background: color-mix(in oklab, var(--gold) 9%, var(--paper));
}
.rev2-note__label {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 6px;
}
.rev2-note p {
  margin: 0;
  font-family: var(--font-body);
  font-size: 15px; line-height: 1.6; font-style: italic;
  color: color-mix(in oklab, var(--ink) 88%, transparent);
}
.election-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  margin: 24px 0;
}
@media (max-width: 640px) { .election-grid { grid-template-columns: 1fr; } }
.election-card {
  border: 1px solid var(--hairline-2);
  border-radius: 3px;
  padding: 20px 22px;
  background: var(--athens-2);
  display: grid; gap: 12px; align-content: start;
}
.election-card__tag {
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--gold-deep);
}
.election-card__rate {
  font-family: var(--font-display);
  font-size: 34px; color: var(--ink); line-height: 1;
}
.election-card__rate small { font-size: 14px; color: color-mix(in oklab, var(--ink) 60%, transparent); margin-left: 4px; }
.election-card__terms { display: grid; gap: 7px; font-size: 14px; line-height: 1.5; color: color-mix(in oklab, var(--ink) 85%, transparent); }
.election-card__terms div { padding-left: 14px; position: relative; }
.election-card__terms div::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.election-card__fit {
  border-top: 1px solid var(--hairline-2);
  padding-top: 10px;
  font-size: 12px; font-style: italic;
  color: color-mix(in oklab, var(--ink) 60%, transparent);
}
.rev2-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
@media (max-width: 640px) { .rev2-compare { grid-template-columns: 1fr; } }
.rev2-compare__cell {
  border: 1px solid var(--hairline-2);
  border-radius: 3px;
  padding: 14px 16px;
  display: grid; gap: 4px;
  cursor: pointer;
  background: var(--paper);
  transition: border-color 160ms ease, background 160ms ease;
}
.rev2-compare__cell.is-active { border-color: var(--gold); background: color-mix(in oklab, var(--gold) 7%, var(--paper)); }
.rev2-compare__cell small { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in oklab, var(--ink) 60%, transparent); }
.rev2-compare__cell strong { font-family: var(--font-display); font-size: 26px; font-weight: 400; color: var(--ink); }
.rev2-compare__cell strong em { font-style: normal; font-size: 13px; color: color-mix(in oklab, var(--ink) 55%, transparent); margin-left: 3px; }
.rev2-compare__cell span { font-size: 12px; color: color-mix(in oklab, var(--ink) 65%, transparent); }
.rev2-cheaper { font-style: normal; font-size: 12px; color: var(--success); }
.rev2-compare__note {
  margin-top: 12px;
  font-size: 13px; line-height: 1.55;
  color: color-mix(in oklab, var(--ink) 75%, transparent);
}
.fee-table { margin: 20px 0 8px; border: 1px solid var(--hairline-2); border-radius: 3px; overflow: hidden; }
.fee-table__head {
  display: flex; justify-content: space-between;
  padding: 10px 16px;
  background: var(--athens-2);
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: color-mix(in oklab, var(--ink) 60%, transparent);
  border-bottom: 1px solid var(--hairline-2);
}
.fee-table__row {
  display: flex; justify-content: space-between; gap: 16px;
  padding: 11px 16px;
  font-size: 14px;
  border-bottom: 1px solid color-mix(in oklab, var(--hairline-2) 60%, transparent);
}
.fee-table__row:last-of-type { border-bottom: 0; }
.fee-table__row strong { font-family: var(--font-display); font-weight: 400; color: var(--gold-deep); white-space: nowrap; }
.fee-table__foot {
  padding: 9px 16px;
  font-size: 11px; font-style: italic;
  color: color-mix(in oklab, var(--ink) 55%, transparent);
  border-top: 1px solid var(--hairline-2);
  background: var(--athens-2);
}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#1b1c20">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1b1c20"/>
    <g fill="none" stroke="#C9A348" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <rect x="430" y="250" width="340" height="300" rx="6"/>
      <path d="M495 250 L470 550 M715 250 L690 550"/>
      <path d="M470 340 H730 M470 460 H730"/>
    </g>
    <text x="600" y="640" fill="#C9A348" font-family="Georgia, serif" font-size="46" letter-spacing="8" text-anchor="middle">TMG</text>
    <text x="600" y="690" fill="#8a8a85" font-family="Georgia, serif" font-size="20" letter-spacing="4" text-anchor="middle">LIVE CONTRACT</text>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="contract-content.jsx"></script>
<script type="text/babel" src="contract-content-rev2.jsx"></script>
<script type="text/babel" src="signing.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "viewerRole": "tmg",
  "mode": "dark",
  "signerProgress": "requested",
  "showAudit": false,
  "showAdminBar": false
}/*EDITMODE-END*/;

// ---- Contract data --------------------------------------------------
const PARAMS = {
  monthlyRate: 615,
  feePct: 15,
  royaltyThreshold: 50000,
  royaltyPct: 5,
  optionARate: 615,
  optionBRate: 1025,
  royaltyCapMonths: 36,
};

const SIGNERS_INITIAL = [
  {
    id: "tmg",
    name: "Mustapha C.A. Jr.",
    role: "Founder & Creative Director",
    entity: "Thiink Media Graphics, LLC",
    email: "team@thiinkmediagraphics.com",
    order: 1,
    state: "pending",
  },
  {
    id: "client",
    name: "Joaquin Thompson Sr.",
    role: "Chief Executive Officer",
    entity: "My College Finance, LLC",
    email: "joaquinthompsonsr@yahoo.com",
    order: 2,
    state: "pending",
  },
];

const FAQ_ITEMS = [
  { q: "Why does the contract show both $615 and $1,025?", a: "Rev. 2 replaces the single royalty clause with a two-option election (§7.13). Option A: $615/month plus a 5% royalty that applies only to products TMG materially designed, only above $50,000 a year per product, and only for 36 months from each product's launch. Option B: $1,025/month flat with no royalty whatsoever. You pick one at signature — use the comparison calculator in §7.13 to model both." },
  { q: "Who owns the final work and the source files?", a: "You own all final deliverables and your complete brand identity — logos, names, trademarks, and trademark filing rights — the moment they're fully paid for (§7.1). TMG keeps its pre-existing IP and what's underneath: frameworks, design systems, working files, templates (§7.2). Source files can be bought at the fixed prices published in §8.9, and you get a free 30-day export window for everything you own when the engagement ends." },
  { q: "What triggers the 5% royalty in §7.13?", a: "Only if you elect Option A — and even then, only products materially designed by TMG, only once a product clears $50,000 in annual gross revenue, and only for 36 months from that product's launch. You notify TMG within 15 business days of crossing the threshold; royalty is paid quarterly. Under Option B there is no royalty, no reporting, and no audit — ever." },
  { q: "Can I work with another design studio during the Term?", a: "During the Term, TMG remains your exclusive partner for overlapping services (§6.3) — but the old six-month post-term restriction is deleted, so you're free the day the Term ends. The former right of first refusal is now a non-binding right to bid (§7.7): TMG gets notice and ten business days to submit a proposal, and you're free to choose any vendor." },
  { q: "What counts as 'reputational harm' under §8.5?", a: "It's now an objective test: conduct a reasonable person in the same industry would consider materially harmful — neither party is the sole arbiter anymore. Termination on those grounds requires 15 days' written notice describing the specific conduct and an opportunity to cure before anything ends." },
  { q: "Are electronic signatures actually binding?", a: "Yes — under the U.S. ESIGN Act and the Georgia Uniform Electronic Transactions Act (UETA). See §11.12. This page captures your signature with timestamp, IP, and SHA-256 hash and embeds the audit trail as a Certificate of Completion in the final PDF." },
  { q: "What if I miss the approval window for a monthly roadmap?", a: "Per §2.4, the roadmap is deemed conditionally approved and timelines reset to the date of your eventual response. TMG isn't liable for the resulting delay. Persistent silence can escalate to suspension (§8.3)." },
  { q: "Can I request changes after I sign?", a: "Once you sign, this party's signature is locked. Substantive changes after signing require an admin reset (which invalidates all signatures and re-issues links) or a formal amendment under §11.7. Use 'Request Changes' before signing." },
];

// ---- Audit log ------------------------------------------------------
function nowFmt() {
  return new Date().toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
}
function uid() { return Math.random().toString(16).slice(2, 8); }

// ---- App ------------------------------------------------------------
function App() {
  const [t, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [signers, setSigners] = useState(SIGNERS_INITIAL);
  const [progress, setProgress] = useState(0);
  const [activeSection, setActiveSection] = useState("recitals");
  const [pe, setPE] = useState({});
  const [showRequest, setShowRequest] = useState(false);
  const [showAdminPw, setShowAdminPw] = useState(false);
  const [showAdminReset, setShowAdminReset] = useState(false);
  const [adminAuthed, setAdminAuthed] = useState(false);
  const [toast, setToast] = useState(null);
  const [audit, setAudit] = useState([
    { t: "May 20, 2026 · 9:14 AM EDT", ev: "Created", who: "Mustapha C.A. Jr.", what: "Contract authored from /contracts/joaquin-mcf-2026.mdx" },
    { t: "May 20, 2026 · 9:14 AM EDT", ev: "Sent", who: "System", what: "Magic links dispatched to both signers" },
    { t: "May 21, 2026 · 11:02 AM EDT", ev: "Opened", who: "Joaquin Thompson Sr.", what: "Cover viewed · IP 71.x.x.x" },
  ]);

  // Reflect tweak-driven simulation states into signers
  useEffect(() => {
    setSigners((sg) => {
      let next = sg.map((s) => ({ ...s }));
      const tmg = next.find((s) => s.id === "tmg");
      const client = next.find((s) => s.id === "client");
      switch (t.signerProgress) {
        case "ready":
          tmg.state = "pending";
          client.state = "current";
          break;
        case "opened":
          tmg.state = "pending";
          client.state = "opened";
          break;
        case "requested":
          tmg.state = "pending";
          client.state = "requested";
          break;
        case "client-signed":
          tmg.state = "current";
          client.state = "signed";
          client.signature = client.signature || { type: "type", name: client.name, font: "Allison" };
          client.signedAt = client.signedAt || "May 22, 2026 · 4:32 PM EDT";
          client.ip = client.ip || "71.45.118.20";
          break;
        case "complete":
          tmg.state = "signed";
          tmg.signature = tmg.signature || { type: "type", name: tmg.name, font: "Caveat" };
          tmg.signedAt = tmg.signedAt || "May 23, 2026 · 9:18 AM EDT";
          tmg.ip = tmg.ip || "70.114.22.8";
          client.state = "signed";
          client.signature = client.signature || { type: "type", name: client.name, font: "Allison" };
          client.signedAt = client.signedAt || "May 22, 2026 · 4:32 PM EDT";
          client.ip = client.ip || "71.45.118.20";
          break;
      }
      return next;
    });
  }, [t.signerProgress]);

  useEffect(() => {
    document.documentElement.setAttribute("data-mode", t.mode);
  }, [t.mode]);

  // Admin auth is independent of toolbar visibility.
  // Toolbar visibility (t.showAdminBar) just toggles whether the bar is shown
  // — only the explicit Log Out button clears adminAuthed.

  // Progress + scrollspy
  useEffect(() => {
    function onScroll() {
      const sc = document.documentElement.scrollTop;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(Math.min(100, Math.max(0, (sc / max) * 100)));

      // active section
      const sections = document.querySelectorAll("[data-toc-num]");
      let best = "recitals";
      sections.forEach((sec) => {
        const top = sec.getBoundingClientRect().top;
        if (top <= 140) best = sec.id;
      });
      setActiveSection(best);
    }
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  function togglePE(key) {
    setPE((p) => ({ ...p, [key]: !p[key] }));
  }

  function showToast(title, body) {
    setToast({ title, body });
    setTimeout(() => setToast(null), 4500);
  }

  function logAudit(ev, what, who = "Joaquin Thompson Sr.") {
    setAudit((a) => [...a, { t: nowFmt(), ev, who, what }]);
  }

  function handleSign(signerId, payload) {
    setSigners((sg) => sg.map((s) => {
      if (s.id !== signerId) return s;
      return { ...s, state: "signed", signature: payload, signedAt: nowFmt(), ip: "71.45.118.20" };
    }));
    logAudit("Signed", `Signature captured (${payload.type}) · SHA-256 attached`, signers.find((s) => s.id === signerId).name);
    setTweak("signerProgress", signerId === "client" ? "client-signed" : "complete");
    showToast("Signed.", `Locked for ${signers.find((s) => s.id === signerId).name}. The other party has been notified.`);
  }

  function handleRequestChanges({ section, note }) {
    setShowRequest(false);
    setTweak("signerProgress", "requested");
    logAudit("Requested Changes", `${section || "—"} · "${note.slice(0, 60)}${note.length > 60 ? "…" : ""}"`);
    showToast("Request sent.", "Mustapha was notified by email. Reply expected within two business days.");
  }

  function handleAdminReset(reason) {
    setShowAdminReset(false);
    setSigners(SIGNERS_INITIAL);
    setTweak("signerProgress", "ready");
    logAudit("Reset to Draft", `Reason: "${reason}" · All signatures invalidated · Magic links re-issued`, "Admin");
    showToast("Contract reset.", "All signatures invalidated. New magic links sent.");
  }

  // Tweak panel handler
  const tabs = [
    { id: "ready", label: "Awaiting", note: "Joaquin's turn to sign" },
    { id: "opened", label: "Opened", note: "Cover viewed, not signed" },
    { id: "requested", label: "Requested changes", note: "Redline submitted to admin" },
    { id: "client-signed", label: "Client signed", note: "TMG signs next" },
    { id: "complete", label: "Complete", note: "Both parties signed, PDF issued" },
  ];

  const currentSignerId = t.viewerRole === "admin" ? "tmg" : (t.viewerRole === "tmg" ? "tmg" : "client");
  const allSigned = signers.every((s) => s.state === "signed");

  return (
    <>
      {/* Progress bar */}
      <div className="progress-bar" style={{ width: progress + "%" }} />

      {/* Header */}
      <header className="header-bar">
        <div className="header-bar__inner">
          <div className="brand">
            <img className="brand__mark" src="assets/tmg-monogram.svg" alt="Thiink Media Graphics monogram" />
            <div>
              <div className="brand__name">Thiink Media Graphics</div>
              <div className="brand__sub">Review Copy · Not for Signature</div>
            </div>
          </div>
          <div className="header-bar__spacer" />
          <div className="header-bar__right">
            <button className="mode-toggle" onClick={() => setTweak("mode", t.mode === "light" ? "dark" : "light")} aria-label="Toggle color mode">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                <path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" />
                <circle cx="8" cy="8" r="3" stroke="currentColor" strokeWidth="1.2" />
              </svg>
              {t.mode === "light" ? "Day" : "Night"}
            </button>
          </div>
        </div>
      </header>

      {/* Cover */}
      <Cover signer={signers.find((s) => s.id === "client")} />

      {/* Signer status strip — review-mode label */}
      <div className="status-strip">
        <div className="status-strip__inner">
          <span className="status-strip__label">Status</span>
          <span className="signer-chip">
            <span className="signer-chip__avatar">R</span>
            <span className="signer-chip__name">Review in progress</span>
            <span className="state-pill state-current">Awaiting your feedback</span>
          </span>
          <span style={{ fontSize: 12, color: "color-mix(in oklab, var(--ink) 60%, transparent)", fontStyle: "italic" }}>
            This document is for review only. The signature page is disabled.
          </span>
        </div>
      </div>

      {/* Body shell */}
      <div className="shell">
        <TOC activeSection={activeSection} />

        <main className="contract">
          <SectionRecitals pe={pe} setPE={togglePE} />
          <SectionScope pe={pe} setPE={togglePE} />
          <SectionRoadmap pe={pe} setPE={togglePE} />
          <SectionPayment pe={pe} setPE={togglePE} params={PARAMS} />
          <SectionParticipation pe={pe} setPE={togglePE} />
          <SectionCreative pe={pe} setPE={togglePE} />
          <SectionBrand pe={pe} setPE={togglePE} />
          <SectionIP pe={pe} setPE={togglePE} params={PARAMS} />
          <SectionTerm pe={pe} setPE={togglePE} />
          <SectionWarranties pe={pe} setPE={togglePE} />
          <SectionIndemnity pe={pe} setPE={togglePE} />
          <SectionGeneral pe={pe} setPE={togglePE} />

          {/* FAQ */}
          <section id="faq" data-toc-num="?" data-toc-title="FAQ">
            <div className="section-eyebrow-row">
              <span className="eyebrow">Questions before you sign</span>
            </div>
            <h1 className="section-title">FAQ</h1>
            <div className="thin-rule" />
            <FAQAccordion items={FAQ_ITEMS} />
            <p style={{ marginTop: 32, fontStyle: "italic", color: "color-mix(in oklab, var(--ink) 70%, transparent)" }}>
              Still have questions? <button onClick={() => setShowRequest(true)} style={{ color: "var(--gold-deep)", borderBottom: "1px dotted var(--gold)", paddingBottom: 1 }}>Request changes</button>.
            </p>
          </section>

          {/* Execution / signature block removed in Review Copy */}
          <section id="signature" data-toc-num="XII" data-toc-title="Execution">
            <div className="section-eyebrow-row">
              <span className="eyebrow">Signature page</span>
            </div>
            <h1 className="section-title">Execution</h1>
            <div className="thin-rule" />
            <div className="review-notice">
              <div className="review-notice__seal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M5 9h14M5 14h14M9 5l-2 14M17 5l-2 14" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                </svg>
              </div>
              <div className="review-notice__body">
                <div className="review-notice__eyebrow">Review copy</div>
                <h2 className="review-notice__title">No signature required.</h2>
                <p>This document is for your review only. The signature page, audit trail, and admin controls are removed in this copy.</p>
                <p>When you're ready to sign — or if any section needs adjustment — reply to your invitation email or use the <button className="review-notice__link" onClick={() => setShowRequest(true)}>request changes</button> button at the bottom-right of this page. We'll send the binding signing link once everything looks right.</p>
                <div className="review-notice__signers">
                  <div className="review-notice__signer">
                    <div className="review-notice__signer-x">×</div>
                    <div className="review-notice__signer-rule" />
                    <div className="review-notice__signer-meta">
                      <strong>Mustapha C.A. Jr.</strong>
                      Founder &amp; Creative Director · Thiink Media Graphics, LLC
                    </div>
                  </div>
                  <div className="review-notice__signer">
                    <div className="review-notice__signer-x">×</div>
                    <div className="review-notice__signer-rule" />
                    <div className="review-notice__signer-meta">
                      <strong>Joaquin Thompson Sr.</strong>
                      Chief Executive Officer · My College Finance, LLC
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <footer className="footer">
            <div className="pull">“See twice. Build once.”</div>
            <img className="footer__wordmark" src="assets/tmg-wordmark.svg" alt="Thiink Media Graphics" />
            <div>Thiink Media Graphics, LLC · Est. 2019 · Stone Mountain, GA</div>
          </footer>
        </main>
      </div>

      {/* Floating action: Request Changes */}
      {!allSigned && (
        <div className="float-bar">
          <button className="float-btn" onClick={() => setShowRequest(true)}>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 13l3-1 8-8-2-2-8 8-1 3z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" /></svg>
            Request Changes
          </button>
          <button
            className={`float-btn float-btn--ghost float-back ${progress > 5 ? "is-visible" : ""}`}
            onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
            aria-label="Back to top"
          >
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 12V4M4 8l4-4 4 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" /></svg>
          </button>
        </div>
      )}

      {/* Admin overlay disabled in Review Copy */}

      {/* Modals — review copy keeps only the request-changes modal */}
      {showRequest && <RequestChangesModal onClose={() => setShowRequest(false)} onSubmit={handleRequestChanges} />}

      {/* Toasts */}
      {toast && (
        <div className="toast-host">
          <div className="toast">
            <strong>{toast.title}</strong>
            {toast.body}
          </div>
        </div>
      )}

      {/* Tweaks panel */}
      <TMGTweaks t={t} setTweak={setTweak} />
    </>
  );
}

// ---- TOC -----------------------------------------------------------
function TOC({ activeSection }) {
  const items = [
    { id: "recitals", num: "—", title: "Recitals" },
    { id: "scope", num: "I", title: "Scope of Services" },
    { id: "roadmap", num: "II", title: "Monthly Roadmap" },
    { id: "payment", num: "III", title: "Payment Terms" },
    { id: "participation", num: "IV", title: "Client Participation" },
    { id: "creative", num: "V", title: "Creative Direction" },
    { id: "brand", num: "VI", title: "Brand Protection" },
    { id: "ip", num: "VII", title: "License & IP" },
    { id: "term", num: "VIII", title: "Term & Termination" },
    { id: "warranties", num: "IX", title: "Warranties" },
    { id: "indemnity", num: "X", title: "Liability" },
    { id: "general", num: "XI", title: "General Terms" },
    { id: "faq", num: "?", title: "FAQ" },
    { id: "signature", num: "XII", title: "Execution" },
  ];
  return (
    <aside className="toc">
      <div className="toc__eyebrow">Contents</div>
      <ul className="toc__list">
        {items.map((it) => (
          <li key={it.id}>
            <a
              href={`#${it.id}`}
              className={`toc__link ${activeSection === it.id ? "is-active" : ""}`}
              onClick={(e) => {
                e.preventDefault();
                const el = document.getElementById(it.id);
                if (el) {
                  const y = el.getBoundingClientRect().top + window.scrollY - 80;
                  window.scrollTo({ top: y, behavior: "smooth" });
                }
              }}
            >
              <span className="toc__num">{it.num}</span>
              <span>{it.title}</span>
            </a>
          </li>
        ))}
      </ul>
    </aside>
  );
}
